name: Dev - Build and Deploy to Azure Container Registry

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    name: 'Build and Push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate sha
      id: generate_sha
      run: |
        SHA=$(echo $GITHUB_SHA | head -c7)
        echo "sha=$SHA" >> $GITHUB_OUTPUT

    - name: Build Docker Image
      run: docker build . -t ${{vars.DEV_LOGINSERVER}}/nlw.service.passin:${{ steps.generate_sha.outputs.sha }}

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v2
      with:
          login-server: ${{vars.DEV_LOGINSERVER}}
          username: ${{ secrets.DEV_ACR_USERNAME }}
          password: ${{ secrets.DEV_ACR_PASSWORD }}

    - name: Push image Azure Container Registry
      run: |
        docker push ${{vars.DEV_LOGINSERVER}}/nlw.service.passin:${{ steps.generate_sha.outputs.sha }}
        docker tag ${{vars.DEV_LOGINSERVER}}/nlw.service.passin:${{ steps.generate_sha.outputs.sha }} ${{vars.DEV_LOGINSERVER}}/nlw.service.passin:latest
        docker push ${{vars.DEV_LOGINSERVER}}/nlw.service.passin:latest
