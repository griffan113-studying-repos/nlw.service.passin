name: Build and deploy container app to Azure Web App

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  ############################################################
  # 1) JOB: Build and Push to Azure Container Registry (ACR)
  ############################################################

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    outputs:
      shortSha: ${{ steps.generate_sha.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use shorter SHA

      - name: Generate short SHA
        id: generate_sha
        run: |
          SHA_SHORT=$(echo $GITHUB_SHA | head -c7)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.DEV_LOGINSERVER }}
          username: ${{ secrets.DEV_ACR_USERNAME }}
          password: ${{ secrets.DEV_ACR_PASSWORD }}

      - name: Build Docker Image
        run: docker build . -t ${{ vars.DEV_LOGINSERVER }}/passin-api:${{ steps.generate_sha.outputs.sha_short }}-dev

      - name: Push Docker Image
        run: |
          docker push ${{vars.DEV_LOGINSERVER}}/passin-api:${{ steps.generate_sha.outputs.sha }}-dev
          docker tag ${{vars.DEV_LOGINSERVER}}/passin-api:${{ steps.generate_sha.outputs.sha }}-dev ${{vars.DEV_LOGINSERVER}}/passin-api:latest-dev
          docker push ${{vars.DEV_LOGINSERVER}}/passin-api:latest-dev

  ############################################################
  # 2) JOB: Deploy to the Azure Web App
  ############################################################

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build-and-push

    outputs:
      webAppUrl: ${{ steps.deploy_webapp.outputs.webapp-url}}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} # Format: https://github.com/Azure/login?tab=readme-ov-file#creds

      - name: Configurar credenciais do ACR no App Service
        run: |
          az webapp config container set \
            --name ${{ vars.APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --docker-registry-server-url "https://${{ vars.DEV_LOGINSERVER }}" \
            --docker-registry-server-user ${{ secrets.DEV_ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DEV_ACR_PASSWORD }}

      - name: Deploy container to Web App
        id: deploy_webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{vars.APP_NAME}}

          images: "${{ vars.DEV_LOGINSERVER }}/passin-api:${{ needs.build-and-push.outputs.shortSha }}-dev"

          # Generate in Azure Portal
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}