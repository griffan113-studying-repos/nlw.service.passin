    #       docker build . -t ${{vars.LOGINSERVER}}/nlw.service.passin:${{ steps.generate_sha.outputs.sha }}
    #       docker push ${{vars.LOGINSERVER}}/nlw.service.passin:${{ steps.generate_sha.outputs.sha }}
